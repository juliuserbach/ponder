[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ponder"
version = "0.1.0"
description = "Learning generation and rethinking order for frozen masked generators"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "huggingface_hub>=0.34",  # the `hf` command for the weights
    "numpy",
    "pyyaml",
    "torch>=2.4",
]

[project.optional-dependencies]
# MAR-B and the FD-Loss evaluator (which imports wandb and rich at module level).
mar = [
    "huggingface_hub",
    "opencv-python-headless",
    "pillow",
    "requests",
    "rich",
    "scipy<1.18",
    "timm>=1.0",
    "torchvision",
    "tqdm",
    "wandb",
]
maskgen = [
    "accelerate",
    "diffusers",
    "einops",
    "huggingface_hub",
    "omegaconf",
    "open_clip_torch==3.3.0",
    "pillow",
    "requests",
]
# PickScore and ImageReward for the HPSv2 benchmark table.
maskgen-eval = [
    "fairscale",
    "image-reward @ git+https://github.com/THUDM/ImageReward@78f8051059b34fef8e0032ccb40561c23a2ddbbb",
    "transformers>=4.46,<5",
]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["ponder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
