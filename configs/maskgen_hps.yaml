# PONDER policy for MaskGen-KL-XL with the HPSv2.1 reward (paper: policy at
# update 11,000, selected by R=4 HPSv2 on the benchmark prompts every 1,000 updates).
# Trained on 4 GPUs: 128 groups x 8 trajectories per update, 256 per microbatch.
task: maskgen
seed: 42
updates: 50000
groups_per_update: 128
group_size: 8
microbatch: 256
save_every: 1000
advantage_threshold: 1.0e-5
gradient_clip: 1.0
# 2e-5, then 1e-5 from update 10,192 on (the paper run lowered it once validation plateaued).
learning_rate: {initial: 2.0e-5, final: 1.0e-5, hold: 10192, decay: 1}
entropy: {initial: 0.01, final: 0.0, decay: 10000}
adam: {betas: [0.9, 0.95], eps: 1.0e-8}
policy: {input_width: 1296, width: 1024, depth: 4, heads: 8, feedforward_width: 4096, action_heads: 1}

maskgen:
  reward: hpsv2  # on the 103,672 unique HPDv2 training prompts
  removal_budgets: [0, 1, 2, 3, 4, 5, 6, 7, 8]  # one rethinking budget R per update, uniform
  # The paper run used R = 4 (noise capacity 4) for its first 3,670 updates.
  warm_start: {updates: 3670, removals: 4}
  source: external/1d-tokenizer  # bytedance/1d-tokenizer at 942a96f
  hps_checkpoint: checkpoints/HPS_v2.1_compressed.pt  # xswu/HPSv2
